<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tessera NumPy Plot</title>
<style>body{margin:0;padding:24px;font:14px system-ui;color:#20242b}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}canvas{width:100%;height:420px;border:1px solid #d7dce2;border-radius:8px}#status{color:#5b6470}input{padding:8px;min-width:260px}</style></head>
<body><header><h2>NumPy output</h2><label>Bridge token <input id="token" type="password" autocomplete="off" placeholder="Paste token from VS Code output"></label><span id="status">Waiting…</span></header><canvas id="plot" width="1200" height="520"></canvas>
<script>
const canvas=document.getElementById("plot"),ctx=canvas.getContext("2d"),statusEl=document.getElementById("status"),tokenEl=document.getElementById("token");
tokenEl.value=sessionStorage.getItem("tesseraBridgeToken")||"";
tokenEl.addEventListener("change",()=>sessionStorage.setItem("tesseraBridgeToken",tokenEl.value));
function draw(data){const x=data?.result?.x,y=data?.result?.y;if(!Array.isArray(x)||!Array.isArray(y)||!x.length||x.length!==y.length){statusEl.textContent="No valid x/y arrays";return}
const W=canvas.width,H=canvas.height,p=58,xmin=Math.min(...x),xmax=Math.max(...x),ymin=Math.min(...y),yr=(Math.max(...y)-ymin)||1;
const px=v=>p+(v-xmin)/((xmax-xmin)||1)*(W-2*p),py=v=>H-p-(v-ymin)/yr*(H-2*p);
ctx.clearRect(0,0,W,H);ctx.strokeStyle="#8b929b";ctx.beginPath();ctx.moveTo(p,p);ctx.lineTo(p,H-p);ctx.lineTo(W-p,H-p);ctx.stroke();
ctx.strokeStyle="#1769aa";ctx.lineWidth=3;ctx.beginPath();x.forEach((v,i)=>i?ctx.lineTo(px(v),py(y[i])):ctx.moveTo(px(v),py(y[i])));ctx.stroke();
ctx.fillStyle="#303640";ctx.font="16px system-ui";ctx.fillText(data.result.label||"NumPy series",p,28);statusEl.textContent="Run "+data.id+" · "+x.length+" samples";}
async function refresh(){try{const r=await fetch("/v1/latest",{headers:{Authorization:"Bearer "+tokenEl.value}});const d=await r.json();if(d.status==="completed")draw(d);else statusEl.textContent=d.error||d.status||"Waiting…"}catch(e){statusEl.textContent=String(e)}}
tokenEl.addEventListener("change",refresh);refresh();setInterval(refresh,1500);
</script></body></html>
